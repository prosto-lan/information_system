<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/style.css">
    <title>Tasks</title>
</head>
<body class="body">
    <main class="main">
        <div class="task">
            <h3>Автор работы Лобанов Артём П-38</h3>

            <h3>Проверка прямолинейности триугольника</h3>
            <input type="number" id="A" placeholder="Сторона A">
            <input type="number" id="B" placeholder="Сторона B">
            <input type="number" id="C" placeholder="Сторона C">

            <button onclick="checkTriangle()">кнопка</button>
        </div>

        <div class="task">
            <h3>Замена цифр больших Z на Z в числе N</h3>
            <input type="number" id="N" placeholder="Число N">
            <input type="number" id="Z" placeholder="Цифра Z">

            <button onclick="replaceNums()">Заменить</button>
        </div>

        <div class="math-table">
            <h2>Таблица умножения:</h2>
            <table border="3">
                <script src="./math_table.js"></script>
            </table>
        </div>
    </main>
</body>
<script src="./brain.js"></script>
</html>
