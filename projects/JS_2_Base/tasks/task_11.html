<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java Script - Задание 11</title>
</head>
<body>
    <h2>Java Script - Задание 11</h2>
    <script>
        document.write("<table border=1>");
        for (let i = 1; i <= 100; i++) {
            document.write("<tr>");
            document.write("<td>" + i + "</td>");
            document.write("</tr>");
        }
        document.write("</table>");
    </script>
</body>
</html>
