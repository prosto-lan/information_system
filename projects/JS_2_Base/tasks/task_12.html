<!DOCTYPE html>

    <title>Java Script - Задание 12</title>
</head>
<body>
    <h2>Java Script - Задание 12</h2>
    <script>
        a=prompt("Введите число") 
        i=1 
        while(i<=10) 
        {
        document.write(a+"x"+i+"="+a*i+"<br>") 
        i++
        } 
    </script>
</body>
