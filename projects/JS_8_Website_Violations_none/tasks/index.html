<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./index.css">
    <title>Drag&Drop</title>
</head>
<body class="body">
    <main class="main">
        <div class="wrapper-boxes">
            <div id="source" class="box" 
            ondragenter="return dragEnter(event)" 
            ondrop="return dragDrop(event)" 
            ondragover="return dragOver(event)">

                <div id="FirstDragItem" class="item" draggable="true" ondragstart="return dragStart(event)" 
                ondragend="return dragEnd(event)">
                    <p>text 1</p>
                </div>
                <div id="TwiceDragItem" class="item" draggable="true" ondragstart="return dragStart(event)" 
                ondragend="return dragEnd(event)">
                    <p>text 2</p>
                </div>
                <div id="ThirdDragItem" class="item" draggable="true" ondragstart="return dragStart(event)" 
                ondragend="return dragEnd(event)">
                    <p>text 3</p>
                </div>

            </div>
            <div id="target" class="box" 
            ondragenter="return dragEnter(event)" 
            ondrop="return dragDrop(event)" 
            ondragover="return dragOver(event)">
            </div>

            <div id="target" class="box" 
            ondragenter="return dragEnter(event)" 
            ondrop="return dragDrop(event)" 
            ondragover="return dragOver(event)">
            </div>
        </div>
    </main>
</body>
<script src="./script.js"></script>
</html>
